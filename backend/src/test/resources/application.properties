# Test profile configuration.
# Tests must never touch the developer PostgreSQL database, because repository
# tests assume an empty, isolated schema.
spring.application.name=Shared Services Hub-backend-test
server.port=0

spring.datasource.url=jdbc:h2:mem:ssh_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.liquibase.enabled=false
spring.cache.type=none
spring.data.redis.repositories.enabled=false

jwt.secret=sshTestSecretKeyForAutomatedTests123456789
jwt.expiration=86400000

logging.level.com.ssh=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
